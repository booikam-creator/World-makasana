<div class="contain">
    <app-navbar></app-navbar>
    <div class="container h-100 py-3">
        <div class="grid-container">
            <div class="bg-light card-main rounded-2 container py-3">
                <h6 class="text">Eats</h6>
                <div class="main">
                    <img src="https://i.postimg.cc/rpTzG50n/1000093962-removebg-preview.png" alt class="main-img">
                </div>
            </div>
            <div class="bg-light card-main rounded-2 container py-3 xon">
                <h6 class="text">Grocery</h6>
                <div class="main pt-2">
                    <img src="https://i.postimg.cc/m2wFdX4K/1000093964-removebg-preview.png" alt="" class="main-img">
                </div>
            </div>
            <div class="bg-light card-main rounded-2 container py-3 xon">
                <h6 class="text">Services</h6>
                <div class="main">
                    <img src="https://i.postimg.cc/G2wPJtw3/1000094062-removebg-preview.png" alt="" class="main-img">
                </div>

            </div>

        </div>
        <div class="grid-container-2 my-3">

            <div class="bg-light card-main rounded-2 container py-3 xon">
                <h6 class="text">Express Delivery</h6>
                <div class="main">
                    <img src="https://i.postimg.cc/j2tJj3Bq/1000094092-removebg-preview.png" alt=""
                        class="main-img truck">
                </div>
            </div>
            <div class="bg-navy card-main text-white rounded-2 container py-3 xon">
                <h6 class="text">Market</h6>
                <div class="main">
                    <img src="https://i.postimg.cc/V61VYmsr/1000094094-removebg-preview.png" alt=""
                        class="main-img fashion">
                </div>
            </div>
        </div>
        <div class="ca py-3">
            <div class="d-flex mb-2 align-items-center justify-content-between">
                <h5 class="text mb-0">LOCAL FLAVOUR</h5>
                <div class="icon d-flex justify-content-center rounded-circle align-items-center  bg-light">
                    <i class="bi  bi-arrow-right"></i>
                </div>
            </div>
            <div class="d-flex over">
                <div class="bg-url rounded-2 col-12 bg-dark" [ngClass]="{'me-3': !isLast }"
                    [ngStyle]="{'background-image': 'url(' + shop.cover + ')'}"
                    *ngFor="let shop of shopList; let isLast = last" routerLink="/store/{{shop.name}}">
                    <div class="d-flex w-100 align-items-start h-100 flex-column">
                        <div class="d-flex container py-2">
                            <p class="span text">30 mins</p>
                        </div>
                        <div class="mt-auto w-100">
                            <div
                                class="box border-start border-bottom rounded-bottom-2 border-end container text-black py-3">
                                <h6 class="text mb-0">{{shop.name}}</h6>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>
        <div class="col py-3">
            <div class="d-flex mb-2 align-items-center justify-content-between">
                <h5 class="text mb-0">MOST POPULAR SERVICE</h5>
                <div class="icon d-flex justify-content-center rounded-circle align-items-center  bg-light">
                    <i class="bi  bi-arrow-right"></i>
                </div>
            </div>
            <div class="grid-equal">
                <div class="col rounded-2  shadow">
                    <div class="con">
                        <img src="https://i.postimg.cc/Rhvfkmyw/1780391344430-e62ebf.jpg" alt=""
                            class="w-100 rounded-top-2">
                    </div>
                    <div class="container py-2">
                        <h6 class="text card-title">Relaxation Massage</h6>

                    </div>
                </div>
                <div class="col rounded-2 shadow">
                    <img src="https://i.postimg.cc/K4SXG97x/77c846f1a3849b039118493081da18f4.jpg"
                        class="w-100 rounded-top-2">
                    <div class="container py-2">
                        <h6 class="text card-title mb-2">Relaxation Massage</h6>
                        <div class="d-flex justify-content-between align-items-center" >
                            <h6 class="text mb-0"><span class="span">R</span> 300.00</h6>
                            <div class="icon text-white d-flex justify-content-center align-items-center bg-navy">
                                <i class="bi bi-plus"></i>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <app-bottombar></app-bottombar>
</div>
