<div class="fixed-top bg-white text vh-100">

    <div class="container  br py- d-flex w-100 align-items-end flex-column">
        <div class="d-flex align-items-center py-2 w-100">

            <button type="button" class="btn p-0 btn-b d-flex justify-content-center align-items-center rounded-circle border">
                <i class="bi bi-arrow-left"></i>
            </button>
             

        </div>

        <div class="mt-5 w-100">
            <h2 class="text mb-3 bold">Verify Email Address</h2>
            <p class="text des text-secondary"> We sent a 4-digit code to emaill adress. Enter it below to complete verification.</p>

        </div>
    </div>
    <div class="container d-flex" >
        <p class="bg-light p-1 px-2 mb-3 span text-secondary rounded">mfekethothulanegmail.com</p>
    </div>


    <div class="input-container container justify-content-between d-flex">

        <input type="number" class="form-control shadow-sm text-center"  maxLength="1"
            [(ngModel)]="val1" (ngModelChange)="onInputChange($event, null, input2)"
            (keydown)="onKeyDown($event, null, input1)" #input1 />

        <input type="number" class="form-control shadow-sm text-center" maxLength="1"
            [(ngModel)]="val2" (ngModelChange)="onInputChange($event, input1, input3)"
            (keydown)="onKeyDown($event, input1, input2)" #input2 />

        <input type="number" maxLength="1" class="form-control shadow-sm text-center  " 
            [(ngModel)]="val3" (ngModelChange)="onInputChange($event, input2, input4)"
            (keydown)="onKeyDown($event, input2, input3)" #input3 />

        <input type="number" maxlength="1" class="text-center form-control shadow-sm " [(ngModel)]="val4"
            (ngModelChange)="onInputChange($event,input3,null)" (keydown)="onKeyDown($event, input3, input4)" #input4>
    </div>
    <div class="d-flex pt-3 container justify-content-between">
        <p class="span bg-light  px-2 rounded p-1">0:40</p>
        <p class="span text-secondary">Didn't get a code. <span class="text-black bold">Click to resend</span></p>

    </div>


    <div class="container w-100">
        <button type="button" class="btn bg-navy w-100 rounded-5 text-white p-2 px-4 ">CONTINUE</button>
    </div>
</div>
