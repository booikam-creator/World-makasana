<div class="container bg-light vh-100 fixed-top py-3 ">
    <div class="shadow container bg-white rounded-3 py-3">
        <div class="row align-items-center">
            <div class="col-3">
                <div class="d-">

                    <img src="https://i.postimg.cc/D0Wmx44s/1780680388958.jpg" class="rounded-circle img"
                        alt="User Profile " style=" object-fit: cover;">

                    <div class="h-0 d-flex justify-content-end ">
                        <div class="icon-edit d-flex justify-content-center align-items-center rounded-circle font bg-white shadow">
                        
                        <i class="bi p-2 bi-pencil-square"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col">
                <h6>{{user.name| titlecase}}</h6>
                <p class="text-secondary mb-0 span">{{user.email}}</p>
            </div>
        </div>
    </div>

    <div class="my-3 shadow px-1  bg-white rounded-3 py-3">
        <div class="container">
            <h6>ACCOUNT</h6>
        </div>
        <div class="bg-light p-2 3  rounded-3">

            <div class="d-flex align-items-center mb-2 justify-content-between">
                <div class="d-flex align-items-center">
                    <div class="icon me-3 bg-white d-flex justify-content-center align-items-center rounded-circle ">
                        <i class="bi bi-shield-lock"></i>
                    </div>
                    <p class="span text-black mb-0">Security Settings</p>
                </div>
                <i class="bi font bi-chevron-right"></i>

            </div>
            <div class="d-flex mb-2 align-items-center">
                <div
                    class="icon me-3 bg-white d-flex justify-content-center align-items-center rounded-circle text-secondary">
                    <i class="bi text-black bi-gift"></i>
                </div>
                <p class="span text-black mb-0">Rewards</p>
            </div>
            <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <div class="icon me-3 bg-white d-flex justify-content-center align-items-center rounded-circle ">
                        <svg xmlns="http://www.w3.org/2000/svg" width="1.1em" height="1.1em" viewBox="0 0 48 48">
                            <path d="M0 0h48v48H0z" fill="none" />
                            <g fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="4">
                                <rect width="30" height="36" x="9" y="8" rx="2" />
                                <path stroke-linecap="round" d="M18 4v6m12-6v6m-14 9h16m-16 8h12m-12 8h8" />
                            </g>
                        </svg>

                    </div>
                    <p class="span text-black mb-0">Orders</p>
                </div>
                <i class="bi font bi-chevron-right"></i>

            </div>
        </div>
    </div>

    <div class="my-3 shadow px-1  bg-white rounded-3 py-3">
        <div class="container">
            <h6>PREFERENCES</h6>
        </div>
        <div class="bg-light p-2  rounded-3">


            <div class="d-flex mb-2 align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <div class="icon me-3 bg-white d-flex justify-content-center align-items-center rounded-circle ">
                        <i class="bi bi-question"></i>
                    </div>
                    <p class="span text-black mb-0">Help Center</p>
                </div>
                <i class="bi font bi-chevron-right"></i>

            </div>
            <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <div class="icon me-3 bg-white d-flex justify-content-center align-items-center rounded-circle ">
                        <i class="bi bi-info"></i>

                    </div>
                    <p class="span text-black mb-0">About Us</p>
                </div>
                <i class="bi font bi-chevron-right"></i>

            </div>
        </div>
    </div>
    <div class="my-3 shadow px-1  bg-white rounded-3 py-3">

        <div class="container">
            <div class="d-flex mb-2 align-items-center">
                <div
                    class="icon rounded-circle me-3 text-danger bg-light d-flex justify-content-center align-items-center ">
                    <i class="bi bi-box-arrow-right"></i>
                </div>
                <p class="span text-black mb-0">Log out</p>
            </div>
        </div>

    <app-bottombar></app-bottombar>
