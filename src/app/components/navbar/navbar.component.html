<div class="fixed-top shadow bg-white  container">
    <div class="d-flex py-3 align-items-center justify-content-between">
        <div class="logo bg-white" *ngIf="curUrl === 'home' || curUrl === 'landing'">

        </div>
        <div class="col" *ngIf="curUrl !== 'home' && curUrl !== 'landing'">
            <span class="text text-secondary card-title">Delivery To</span>
            <h6 class="text col-6 mb-0 text-start text-truncate card-title" *ngIf="curUrl !== 'home' ">{{userLocation}}
            </h6>
        </div>
        <div class="d-flex  align-items-center just">

            <div class=" d-flex  align-items-center justify-content-center me-3 "
                [ngClass]="{'d-none':curUrl !== 'home'}" *ngIf="isScrolled || userOverride" (click)="isShow()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-search"
                    viewBox="0 0 16 16">
                    <path
                        d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                </svg>
            </div>
            <button type="button" class="btn text-white bg-navy" data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasBottom" aria-controls="offcanvasBottom">
                Log in
            </button>
        </div>
    </div>
    <div class="input-group mb-3 input-group border-none bg-light br p-2" *ngIf="!isScrolled &&  curUrl !== 'landing' ">

        <input type="text" class="form-control bg-light me-1 border-none" placeholder="WHAT ARE YOU LOOKING FOR!!!"
            aria-label="Sizing example input" aria-describedby="inputGroup-sizing">
        <span class="input-group-text bg-dark border-dark text-white rounded-circle " id="inputGroup-sizing-lg">
            <i class="bi bi-search"></i>
        </span>
    </div>
</div>

<div class=" bg-white  container">
    <div class="d-flex py-3 align-items-center justify-content-between">
        <div class="logo bg-white" *ngIf="curUrl !== 'mc'">

        </div>
        <div class="d-flex  align-items-center just">

            <div class=" d-flex text-white align-items-center justify-content-center  me-3 ">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-search"
                    viewBox="0 0 16 16">
                    <path
                        d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                </svg>
            </div>
            <button type="button" class="btn text-white bg-navy" data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasBottom" aria-controls="offcanvasBottom">
                Log in
            </button>



        </div>

    </div>
    <div class="input-group mb-3 input-group border-none bg-light br p-2" *ngIf="!isScrolled && curUrl !== 'landing'">

        <input type="text" class="form-control bg-light me-1 border-none" placeholder="WHAT ARE YOU LOOKING FOR!!!"
            aria-label="Sizing example input" aria-describedby="inputGroup-sizing">
        <span class="input-group-text bg-dark border-dark text-white rounded-circle " id="inputGroup-sizing-lg">
            <i class="bi bi-search"></i>
        </span>
    </div>
</div>


<div class="offcanvas off pt-3 offcanvas-bottom" tabindex="-1" id="offcanvasBottom"
    aria-labelledby="offcanvasBottomLabel">
    <div class="container pt-3">
        <div class="d-flex justify-content-end">
            <button data-bs-dismiss="offcanvas" type="button" class="btn border text-center icon p-0 rounded-circle">
                <i class="bi bi-x"></i>
            </button>

        </div>
    </div>
    <div class="container">

        <p class="text fw-bold text-center ">Existing Customers</p>

        <div class="form-floating mb-3">
            <input type="email" class="form-control-1 form-control" id="floatingInput" placeholder="name@example.com">
            <label for="floatingInput">Email address*</label>
        </div>
        <div class="form-floating mb-3">
            <input type="password" class="form-control form-control-1" id="floatingPassword" placeholder="Password">
            <label for="floatingPassword">Password*</label>
        </div>

        <button type="button" class="btn mb-2 text-white w-100 py-2 bg-navy">LOG IN</button>
        <div class="d-flex justify-content-center">
            <span class="text-center">By using this website and/or placing an order you agree to the Terms & Conditions
                of MAKAZANA & CO.</span>
        </div>
        <div class="mt-5">
            <p class="text fw-bold text-center ">New Customers</p>

            <button type="button" class="btn mb-3 bg-navy w-100 py-2 bg-light">REGISTER NOW</button>
        </div>
    </div>
</div>
