<div class="fixed-top text">
    <div class="container mb-3">
        <div class="d-flex justify-content-between align-items-center py-3 w-100">

            <button type="button"
                class="btn btn-white p-0 btn-b d-flex justify-content-center align-items-center rounded-circle border">
                <i class="bi bi-arrow-left"></i>
            </button>
            <div class="row w-70  ">
                <div class="col-4 rounded-3 bg-navy p-1">

                </div>
                <div class="col-4 rounded-3 bg-light p-1">
                </div>
                <div class="col-4 rounded-3 bg-light p-1">
                </div>
            </div>

            <div class=" p-0 btn-b d-flex justify-content-center align-items-center rounde">

            </div>

        </div>
    </div>

    <div class="shadow vh-90 rounded-5  ">
        <div class="container py-4">

            <p class="fw-bold span mb-2">STEP 1/3</p>
            <h3 class="text mb-3 ">Merchant Information</h3>
            <div class="con">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingInputBusiName" placeholder="name surname">
                    <label for="floatingInputBusiName">Business Name*</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingInputLoc" placeholder="name@example.com">
                    <label for="floatingInputLoc">Location Address* </label>
                </div>
                <div class="d-flex gap-2">
                    <div class="col">
                        <div class="form-floating mb-3">
                            <input type="number" class="form-control" id="floatingInputPos"
                                placeholder="name@example.com" maxlength="4">
                            <label for="floatingInputPos">Postal Code</label>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="select-container ">

                            <div class="form-floating mb-3" >
                                <input type="text" class="form-control" (click)="toggleDropdown()" id="floatingInputCity"
                                    placeholder="name@example.com" >
                                <label for="floatingInputCity">City</label>
                                
                            </div>
                            <!-- Trigger Box -
                            <div class="select-trigger rounded border bg-white " [class.open]="isOpenCity"
                                [class.has-value]="selectedOption !== null" (click)="toggleDropdown()" role="button"
                                data-bs-toggle="dropdown" aria-expanded="false">

                                <div class="label-container text-black">
                                    <span class="floating-label">City*</span>
                                    <span class="selected-text">

                                    </span>
                                </div>

                                
                                <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                                </svg>
                            </div>
                        -->
                            <ul class="dropdown-menu w-100">
                                <li><a class="dropdown-item"><input class="form-control" type="text"
                                            placeholder="Search City" aria-label="default input example"></a></li>
                                <li><a class="dropdown-item" *ngFor="let city of cities| slice:0:3 ">{{city}}</a></li>

                            </ul>
                        </div>
                    </div>
                </div>
                <div class="select-container ">
                    <!-- Trigger Box -->

                    <div class="select-trigger rounded border bg-white " [class.open]="isOpenCate"
                        [class.has-value]="selectedOption !== null" (click)="toggleCate()" role="button"
                        data-bs-toggle="dropdown" aria-expanded="false">

                        <div class="label-container text-black">
                            <span class="floating-label">Business Category*</span>
                            <span class="selected-text">
                                {{business.categoryBus| titlecase}}
                            </span>
                        </div>

                        <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                        </svg>
                    </div>



                    <ul class="dropdown-menu z-3 w-100">
                        <li><a class="dropdown-item" (click)="seleCate(category.name)" *ngFor="let category of busiCategories|slice:0:3">{{category.name| titlecase}}</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="container bg-white fixed-bottom py-3">
    <button type="button" class="btn bg-navy w-100 rounded-5 text-white p-2 px-4 ">CONTINUE</button>
</div>
