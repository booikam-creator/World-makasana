<div class="fixed-top text">
    <div class="container mb-3">
        <div class="d-flex justify-content-between align-items-center py-3 w-100">

            <button type="button"
                class="btn btn-white p-0 btn-b d-flex justify-content-center align-items-center rounded-circle border">
                <i class="bi bi-arrow-left"></i>
            </button>
            <div class="row gap-1 w-70  ">
                <div class="col rounded-3 bg-navy p-1">

                </div>
                <div class="col rounded-3 bg-navy p-1">
                </div>
                <div class="col rounded-3 bg-light p-1">
                </div>
            </div>

            <div class=" p-0 btn-b d-flex justify-content-center align-items-center rounde">

            </div>

        </div>
    </div>
    <div class="shadow vh-90 rounded-5  ">
        <div class="container py-4">
            <p class="fw-bold span text-secondary mb-2">STEP 2/3</p>

            <h5 class="fw-bold mb-3 ">Primary Contact Information</h5>

            <div class="con">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingInputFullName" placeholder="name surname">
                    <label for="floatingInputFullName">Full Name*</label>
                </div>
                
                <mat-form-field appearance="outline" class="example-full-width w-100">
                    <mat-label class="text">Date Of Birth*</mat-label>
                    <input matInput (ngModel)]="selectedDate" 
                        (dateChange)="onDateSelected($event)"
                            placeholder="MM/DD/YYYY" > 
                </mat-form-field>

            </div>
        </div>
    </div>

</div>
<div class="container bg-white fixed-bottom py-3">
    <button type="button" class="btn bg-navy w-100 rounded-5 text-white p-2 px-4 ">CONTINUE</button>
</div>
